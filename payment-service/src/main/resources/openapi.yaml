openapi: 3.0.0
info:
  title: Payment Service API
  description: RESTful API for managing payment transactions
  version: 1.0.0
  contact:
    name: Payment Service Team
  license:
    name: Apache 2.0

servers:
  - url: http://localhost:8082
    description: Local development server

paths:
  /api/v1/payments:
    get:
      summary: Get all payments
      description: Retrieve a list of all payments in the system
      operationId: getAllPayments
      tags:
        - Payments
      responses:
        '200':
          description: List of payments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    post:
      summary: Create a new payment
      description: Create a new payment transaction
      operationId: createPayment
      tags:
        - Payments
      requestBody:
        description: Payment details to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDTO'
      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers:
            Location:
              description: URI of the created payment
              schema:
                type: string
        '400':
          description: Invalid payment data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

  /api/v1/payments/{id}:
    get:
      summary: Get payment by ID
      description: Retrieve a specific payment by its ID
      operationId: getPaymentById
      tags:
        - Payments
      parameters:
        - name: id
          in: path
          description: Payment ID (must be greater than 0)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Payment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '400':
          description: Invalid payment ID (must be positive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    put:
      summary: Update payment
      description: Update an existing payment by its ID
      operationId: updatePayment
      tags:
        - Payments
      parameters:
        - name: id
          in: path
          description: Payment ID (must be greater than 0)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        description: Updated payment details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDTO'
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid payment data or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

    delete:
      summary: Delete payment
      description: Delete a payment by its ID
      operationId: deletePayment
      tags:
        - Payments
      parameters:
        - name: id
          in: path
          description: Payment ID (must be greater than 0)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Payment deleted successfully
        '400':
          description: Invalid payment ID (must be positive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'

components:
  schemas:
    Payment:
      type: object
      description: Payment entity representing a payment transaction
      properties:
        id:
          type: integer
          format: int64
          description: Unique payment identifier
          example: 1
        orderNumber:
          type: integer
          format: int64
          description: Associated order number
          example: 12345
        amount:
          type: integer
          format: int64
          description: Payment amount in cents
          example: 10000
        tax:
          type: integer
          format: int64
          description: Tax amount in cents
          example: 1000
        status:
          $ref: '#/components/schemas/PaymentStatus'
        customer:
          $ref: '#/components/schemas/Customer'
        createdAT:
          type: string
          format: date-time
          description: Payment creation timestamp
          example: "2026-04-27T10:30:00Z"
      required:
        - id
        - orderNumber
        - amount
        - status
        - customer
        - createdAT

    PaymentDTO:
      type: object
      description: Data Transfer Object for creating or updating payments
      properties:
        orderNumber:
          type: integer
          format: int64
          description: Associated order number
          example: 12345
        amount:
          type: integer
          format: int64
          description: Payment amount in cents
          example: 10000
        customer:
          $ref: '#/components/schemas/Customer'
      required:
        - orderNumber
        - amount
        - customer

    Customer:
      type: object
      description: Customer information embedded in payment
      properties:
        name:
          type: string
          description: Customer full name
          example: "John Doe"
        email:
          type: string
          format: email
          description: Customer email address
          example: "john.doe@example.com"
        address:
          type: string
          description: Customer delivery address
          example: "123 Main Street, Springfield, IL 62701"
      required:
        - name
        - email
        - address

    PaymentStatus:
      type: string
      description: Status of the payment
      enum:
        - PAID
        - PENDING
        - REJECTED
      example: "PENDING"

    ErrorResponseDTO:
      type: object
      description: Error response containing error details
      properties:
        date:
          type: string
          format: date-time
          description: Timestamp when the error occurred
          example: "2026-04-27T10:30:00Z"
        errorMessage:
          type: string
          description: General error message
          example: "Validation failed"
        errors:
          type: array
          description: List of field-specific errors
          items:
            $ref: '#/components/schemas/ErrorField'
      required:
        - date
        - errorMessage

    ErrorField:
      type: object
      description: Details about a specific validation error
      properties:
        field:
          type: string
          description: Name of the field that failed validation
          example: "amount"
        invalidValue:
          type: string
          description: The invalid value provided
          example: "-100"
        error:
          type: string
          description: The error message explaining the validation failure
          example: "must be greater than 0"
      required:
        - field
        - error

tags:
  - name: Payments
    description: Operations related to payment management

