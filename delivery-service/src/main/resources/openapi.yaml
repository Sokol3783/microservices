openapi: 3.0.0
info:
  title: Delivery Service API
  description: API for managing delivery operations including creation, retrieval, updating, and deletion of deliveries
  version: 1.0.0
  contact:
    name: Delivery Service Team
  license:
    name: Apache 2.0
servers:
  - url: http://localhost:8080/api/v1
    description: Delivery Service API v1

paths:
  /deliveries:
    get:
      summary: Get all deliveries
      description: Retrieve a list of all deliveries in the system
      operationId: getAllDeliveries
      tags:
        - Delivery
      responses:
        '200':
          description: Successfully retrieved list of deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new delivery
      description: Create a new delivery with the provided information
      operationId: createDelivery
      tags:
        - Delivery
      requestBody:
        required: true
        description: Delivery data to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDTO'
      responses:
        '201':
          description: Delivery created successfully
          headers:
            Location:
              description: URI of the created delivery
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deliveries/{id}:
    get:
      summary: Get delivery by ID
      description: Retrieve a specific delivery by its unique identifier
      operationId: getDeliveryById
      tags:
        - Delivery
      parameters:
        - name: id
          in: path
          description: The delivery ID (must be greater than 0)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Delivery found and retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: Invalid ID format or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delivery not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a delivery
      description: Update an existing delivery with the provided information
      operationId: updateDelivery
      tags:
        - Delivery
      parameters:
        - name: id
          in: path
          description: The delivery ID (must be greater than 0)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      requestBody:
        required: true
        description: Updated delivery data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryDTO'
      responses:
        '200':
          description: Delivery updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delivery not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a delivery
      description: Delete a delivery by its unique identifier
      operationId: deleteDelivery
      tags:
        - Delivery
      parameters:
        - name: id
          in: path
          description: The delivery ID (must be greater than 0)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '204':
          description: Delivery deleted successfully
        '400':
          description: Invalid ID format or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delivery not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Delivery:
      type: object
      description: A delivery record containing all delivery details
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the delivery
          example: 1
        orderNumber:
          type: integer
          format: int64
          description: The associated order number
          example: 12345
        customer:
          $ref: '#/components/schemas/Customer'
        amount:
          type: integer
          format: int64
          description: Shipping cost in cents
          example: 1000
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        createdAT:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the delivery was created
          example: "2024-04-27T10:30:00Z"
        address:
          type: string
          description: Delivery address
          example: "123 Main Street, City, State 12345"
      required:
        - id
        - customer
        - status

    DeliveryDTO:
      type: object
      description: Data transfer object for creating or updating a delivery
      properties:
        orderNumber:
          type: integer
          format: int64
          description: The associated order number
          example: 12345
        customer:
          $ref: '#/components/schemas/Customer'
        address:
          type: string
          description: Delivery address (optional, defaults to customer address if not provided)
          example: "123 Main Street, City, State 12345"
      required:
        - customer

    Customer:
      type: object
      description: Customer information embedded in delivery records
      properties:
        name:
          type: string
          description: Customer full name
          example: "John Doe"
        email:
          type: string
          format: email
          description: Customer email address
          example: "john.doe@example.com"
        address:
          type: string
          description: Customer address
          example: "123 Main Street, City, State 12345"
      required:
        - name

    DeliveryStatus:
      type: string
      description: Current status of the delivery
      enum:
        - PACKING
        - SHIPPED
        - DELIVERED
      example: PACKING

    ErrorResponse:
      type: object
      description: Error response containing error details and validation errors
      properties:
        date:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred
          example: "2024-04-27T10:30:00Z"
        errorMessage:
          type: string
          description: General error message
          example: "Validation failed"
        errors:
          type: array
          description: List of specific field validation errors
          items:
            $ref: '#/components/schemas/ErrorField'
      required:
        - date
        - errorMessage

    ErrorField:
      type: object
      description: Details of a specific field validation error
      properties:
        field:
          type: string
          description: Name of the field with validation error
          example: "customer"
        invalidValue:
          type: string
          description: The invalid value that was provided
          example: "null"
        error:
          type: string
          description: Description of the validation error
          example: "Customer cannot be null"
      required:
        - field
        - error

tags:
  - name: Delivery
    description: Operations related to deliveries


