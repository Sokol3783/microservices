openapi: 3.0.3
info:
  title: Order Service API
  version: 0.0.1-SNAPSHOT
  description: API for managing orders and order items
servers:
  - url: http://localhost:8081
    description: Local development server
paths:
  /api/v1/orders:
    get:
      summary: Get all orders
      operationId: getAllOrders
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDTO'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
  /api/v1/orders/{id}:
    get:
      summary: Get order by ID
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    put:
      summary: Update an existing order
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDTO'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '400':
          description: Invalid input
    delete:
      summary: Delete an order
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Order deleted
        '404':
          description: Order not found
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        customer:
          $ref: '#/components/schemas/Customer'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        price:
          type: integer
        amount:
          type: integer
    Customer:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        address:
          type: string
    OrderDTO:
      type: object
      required:
        - customer
        - items
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        amount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDTO'
    OrderItemDTO:
      type: object
      required:
        - productName
        - price
        - amount
        - quantity
      properties:
        productName:
          type: string
        price:
          type: integer
        amount:
          type: integer
        quantity:
          type: integer
